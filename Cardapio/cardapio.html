<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmaralHub — Cardápio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS Externo -->
    <link rel="stylesheet" href="cardapio.css">
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col md:flex-row antialiased overflow-x-hidden">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex flex-col items-center justify-center text-white hidden">
        <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-3"></div>
        <p class="text-sm font-medium">Carregando...</p>
    </div>

    <!-- Modal 403 Forbidden -->
    <div id="modal403" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center border-t-4 border-red-600">
            <h3 class="text-lg font-bold text-slate-900 mb-2">Acesso Restrito</h3>
            <p class="text-slate-600 text-xs mb-4">Apenas leitura para perfil Aluno.</p>
            <button onclick="close403Modal()" class="w-full bg-slate-900 text-white font-semibold py-2 rounded-xl text-xs">Fechar</button>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside class="w-full md:w-64 bg-[#0d47a1] text-white flex-shrink-0 flex flex-col justify-between min-h-screen">
        <div>
            <!-- Header / Logo -->
            <div class="pt-8 pb-4 text-center flex items-center justify-center gap-2">
                <div class="relative flex items-center justify-center font-extrabold text-4xl tracking-tight">
                    <span>AH</span>
                    <i class="fa-solid fa-graduation-cap text-lg absolute -top-2 -right-3 rotate-12"></i>
                </div>
            </div>

            <!-- Profile Badge -->
            <div class="px-6 py-2 flex items-center gap-3">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150" alt="Foto do Usuário" class="w-12 h-12 rounded-full object-cover border-2 border-white/80 shadow-md">
                <div class="text-left">
                    <span class="text-[10px] font-bold text-blue-200 uppercase block">ALUNO:</span>
                    <h2 id="sidebarUserName" class="text-sm font-bold text-white leading-tight">Gabriel Silva</h2>
                    <p id="sidebarUserSub" class="text-xs text-blue-200">8º Ano A</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="mt-6 px-3 space-y-1">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-2.5 text-xs rounded-xl sidebar-item-active">
                    <i class="fa-solid fa-house w-4 text-center"></i>
                    <span>Dashboard</span>
                </button>
                <button onclick="switchTab('weekly')" id="nav-weekly" class="w-full flex items-center gap-3 px-4 py-2.5 text-xs text-white hover:bg-white/10 rounded-xl">
                    <i class="fa-solid fa-calendar-days w-4 text-center"></i>
                    <span>Cardápio Semanal</span>
                </button>
                <button onclick="switchTab('nutrition')" id="nav-nutrition" class="w-full flex items-center gap-3 px-4 py-2.5 text-xs text-white hover:bg-white/10 rounded-xl">
                    <i class="fa-solid fa-clipboard-list w-4 text-center"></i>
                    <span>Nutrição</span>
                </button>
                <button onclick="switchTab('restrictions')" id="nav-restrictions" class="w-full flex items-center gap-3 px-4 py-2.5 text-xs text-white hover:bg-white/10 rounded-xl">
                    <i class="fa-solid fa-ban w-4 text-center"></i>
                    <span>Restrições</span>
                </button>
                <button onclick="switchTab('history')" id="nav-history" class="w-full flex items-center gap-3 px-4 py-2.5 text-xs text-white hover:bg-white/10 rounded-xl">
                    <i class="fa-solid fa-rotate-left w-4 text-center"></i>
                    <span>Histórico</span>
                </button>
                <button onclick="switchTab('settings')" id="nav-settings" class="w-full flex items-center gap-3 px-4 py-2.5 text-xs text-white hover:bg-white/10 rounded-xl">
                    <i class="fa-solid fa-gear w-4 text-center"></i>
                    <span>Configurações</span>
                </button>
            </nav>
        </div>

        <div class="p-3 text-center text-[10px] text-blue-200/60 border-t border-blue-900/30">
            AmaralHub v2.1
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#f8fafc]">

        <!-- Top Header Bar -->
        <header class="bg-white border-b border-slate-200/80 px-8 py-3 flex items-center justify-end sticky top-0 z-10">
            <!-- Top Right Profile -->
            <div class="flex items-center gap-4">
                <button class="relative text-slate-400 hover:text-slate-600" title="Notificações">
                    <i class="fa-regular fa-bell text-base"></i>
                    <span class="absolute -top-0.5 -right-0.5 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>

                <div class="flex items-center gap-2 cursor-pointer">
                    <div class="w-7 h-7 rounded-full bg-[#0d47a1] text-white font-bold flex items-center justify-center text-xs">
                        G
                    </div>
                    <span id="topUserName" class="text-xs font-semibold text-slate-700">Gabriel Silva</span>
                    <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                </div>
            </div>
        </header>

        <!-- Main Content Canvas -->
        <div class="p-8 max-w-7xl w-full mx-auto space-y-6">

            <!-- TAB 1: DASHBOARD -->
            <section id="tab-dashboard" class="space-y-6">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Olá, Gabriel! Cardápio de Hoje</h1>
                    <p class="text-xs text-slate-500 font-medium mt-1">Quarta-feira, 24 de Outubro, 2024</p>
                </div>

                <!-- Cards Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="dailyMenuContainer">
                    <!-- Cards inseridos via JS -->
                </div>
            </section>

        </div>
    </main>

    <!-- JavaScript Externo -->
    <script src="cardapio.js"></script>
</body>
</html>
