<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmaralHub - Dashboard do Aluno</title>
    <script src="/global-preferences.js"></script>
    
    <link rel="stylesheet" href="/dark-mode.css">
    <link rel="stylesheet" href="aluno.css">
</head>

<body>
    <!-- SIDEBAR DO ALUNO -->
    <aside class="sidebar">
        <div class="logo">
            <img src="/logo2.png" alt="Logo AH">
        </div>

        <nav class="menu">
            <a href="/Aluno/" class="menu-item active">Início</a>
            <a href="/Cardapio/" class="menu-item">Cardápio</a>
            <a href="#" class="menu-item">Ingredientes</a>
            <a href="/Configuracoes/config.html" class="menu-item">Configurações</a>
        </nav>

        <div class="sidebar-bottom">
            <div class="usuario">
                <div class="usuario-icon">👤</div>
                <span>Aluno</span>
            </div>
            <a href="/login" class="sair">
                <span class="sair-icon">➔</span>
                <span>Sair</span>
            </a>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL DO ALUNO -->
    <main class="conteudo-principal">
        <div class="main-wrapper">
            <header id="introducao">
                <div>
                    <h1>Olá, Aluno(a)!</h1>
                    <p>Bem-vindo(a) ao seu painel no AmaralHub</p>
                </div>
                <button class="notificacao" aria-label="Notificações">🔔</button>
            </header>

            <section id="conteiner">
                <div class="cardapio-header">
                    <div class="titulo-cardapio">
                        <span class="icone-cardapio">📋</span>
                        <h2>Cardápio do Dia</h2>
                    </div>
                </div>

                <div class="cardapio-grid">
                    <article class="refeicao">
                        <div class="etiquetas">
                            <span class="etiqueta hoje">Hoje</span>
                            <span class="etiqueta horario">Almoço</span>
                        </div>
                        <div class="imagem-container">
                            <img src="/comida.jpg" alt="Refeição">
                        </div>
                        <h3>Refeição do Aluno</h3>
                        <p class="alergeno">⚠️ Verifique os ingredientes restritos</p>
                        <button class="informacoes">Informações</button>
                    </article>
                </div>

                <!-- Alerta de Alergia específico para perfil de Aluno -->
                <div id="alergia-container" class="alerta-alergia-box">
                    <div class="alerta-conteudo">
                        <span class="alerta-icon">⚠️</span>
                        <div class="alerta-texto">
                            <strong>Restrições Alimentares</strong>
                            <span>Painel customizado para o seu perfil de saúde.</span>
                        </div>
                    </div>
                    <button id="perfil" class="btn-editar-perfil">Editar Perfil</button>
                </div>
            </section>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!localStorage.getItem('userEmail')) {
                const pathAtual = window.location.pathname.toLowerCase();
                if (pathAtual.includes('aluno')) {
                    localStorage.setItem('userRole', 'aluno');
                } else if (pathAtual.includes('professor')) {
                    localStorage.setItem('userRole', 'professor');
                } else if (pathAtual.includes('adm')) {
                    localStorage.setItem('userRole', 'adm');
                }
            }
        });
    </script>
</body>

</html>
