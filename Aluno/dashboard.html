<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmaralHub - Início</title>
    <link rel="stylesheet" href="cardapio-aluno.css">
</head>

<body>

    <!-- SIDEBAR ADAPTATIVA (RF06) -->
    <aside class="sidebar">
        <div class="logo">
            <img src="/logo2.png" alt="Logo AH">
        </div>

        <nav class="menu">
            <a href="#" class="menu-item">Início</a>
            <a href="#" class="menu-item active">Cardápio</a>
            <a href="#" class="menu-item">Ingredientes</a>
            <a href="/Reservas" class="menu-item" id="menu-reservas" style="display: none;">Reservas</a>
            <a href="/configurações" class="menu-item">Configurações</a>
        </nav>

        <div class="sidebar-bottom">
            <div class="usuario">
                <div class="usuario-icon">👤</div>
                <span id="role-usuario-label">Aluno</span>
            </div>

            <a href="/login" class="sair">
                <span class="sair-icon">➔</span>
                <span>Sair</span>
            </a>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo-principal">
        <div class="main-wrapper">

            <!-- CABEÇALHO -->
            <header id="introducao">
                <div>
                    <h1 id="saudacao-usuario">Olá, Aluno!</h1>
                    <p>Bem-vindo(a) ao AmaralHub</p>
                </div>

                <button class="notificacao" aria-label="Notificações">
                    🔔
                </button>
            </header>

            <!-- CONTAINER DO CARDÁPIO -->
            <section id="conteiner">

                <!-- TOPO DO CARDÁPIO -->
                <div class="cardapio-header">
                    <div class="titulo-cardapio">
                        <span class="icone-cardapio">📋</span>
                        <h2>Cardápio do Dia</h2>
                    </div>
                </div>

                <!-- GRID DOS CARDS DE REFEIÇÃO -->
                <div class="cardapio-grid">

                    <!-- CAFÉ DA MANHÃ -->
                    <article class="refeicao">
                        <div class="etiquetas">
                            <span class="etiqueta hoje">Hoje</span>
                            <span class="etiqueta horario">Café</span>
                        </div>

                        <div class="imagem-container">
                            <img src="comida.jpg" alt="Torta de frango">
                        </div>

                        <h3>Torta de Frango</h3>

                        <p class="alergeno">
                            ⚠️ CONTÉM GLÚTEN!
                        </p>

                        <button class="informacoes">Informações</button>
                    </article>

                    <!-- ALMOÇO -->
                    <article class="refeicao">
                        <div class="etiquetas">
                            <span class="etiqueta tipo">Almoço</span>
                        </div>

                        <div class="imagem-container">
                            <img src="feijoada.jpg" alt="Feijoada">
                        </div>

                        <h3>Feijoada</h3>

                        <button class="informacoes">Informações</button>
                    </article>

                    <!-- LANCHE -->
                    <article class="refeicao">
                        <div class="etiquetas">
                            <span class="etiqueta tipo">Lanche</span>
                        </div>

                        <div class="imagem-container">
                            <img src="mingau.jpg" alt="Mingau">
                        </div>

                        <h3>Mingau</h3>

                        <button class="informacoes">Informações</button>
                    </article>

                </div>

                <!-- FAIXA DE ALERTA DE ALERGIA (Separada da Grid de Comida) -->
                <div id="alergia-container" class="alerta-alergia-box">
                    <div class="alerta-conteudo">
                        <span class="alerta-icon">⚠️</span>
                        <span class="quantidade">1</span>
                        <div class="alerta-texto">
                            <strong>Alergênico detectado</strong>
                            <span>Baseado nas restrições do seu perfil.</span>
                        </div>
                    </div>

                    <button id="perfil" class="btn-editar-perfil">Editar Perfil</button>
                </div>

            </section>
        </div>
    </main>

    <!-- SCRIPT DE ADAPTAÇÃO DE PERMISSÕES (RF06) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Exemplo de lógica simulada de leitura de perfil/token (substitua pela sua lógica real de autenticação)
            const userRole = localStorage.getItem('userRole') || 'Aluno'; // 'Aluno', 'Professor', 'Admin'

            const menuReservas = document.getElementById('menu-reservas');
            const saudacao = document.getElementById('saudacao-usuario');
            const labelUsuario = document.getElementById('role-usuario-label');

            if (labelUsuario) labelUsuario.textContent = userRole;
            if (saudacao) saudacao.textContent = `Olá, ${userRole}!`;

            // RF06: Oculta ou exibe itens do menu dinamicamente conforme a role
            if (userRole === 'Professor' || userRole === 'Admin') {
                if (menuReservas) menuReservas.style.display = 'block'; // Exibe o menu de reservas para professores
            } else {
                if (menuReservas) menuReservas.style.display = 'none'; // Oculta para alunos
            }
        });
    </script>
</body>
</html>
