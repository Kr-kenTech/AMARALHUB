<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMARALHUB - Login Institucional</title>
    <link rel="stylesheet" href="/Login/login.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <a href="/Inicio/inicio.html" id="btn-voltar">← Voltar</a>
    
    <section id="sessao2">
        <div id="imag">
            <img src="/logo.png" alt="Logo AMARALHUB" width="100px">
        </div>

        <div id="login">
            <h3>AMARALHUB</h3>
            <p class="instrucao-login">
                Utilize sua conta institucional para entrar.
            </p>
            
            <!-- Bloco exclusivo para o Google Sign-In (Autenticação Federada sem senhas locais) -->
            <div class="google-container">
                <div id="g_id_onload"
                    data-client_id="520168549437-v1ucd8leun5vjt8r6c94c1fth6htkdu1.apps.googleusercontent.com"
                    data-login_uri="http://localhost:3000/auth/google/callback"
                    data-auto_prompt="false">
                </div>
                
                <div class="g_id_signin"
                    data-type="standard"
                    data-size="large"
                    data-theme="outline"
                    data-text="sign_in_with"
                    data-shape="pill"
                    data-logo_alignment="left">
                </div>
            </div>

            <div class="ajuda-cadastro">
                <span>Primeiro acesso?</span>
                <p>Basta clicar no botão acima e selecionar o seu e-mail institucional <strong>(@aluno.mg.gov.br ou @educacao.mg.gov.br)</strong>. Seu cadastro será feito automaticamente.</p>
            </div>
        </div> 
    </section>
</body>
</html>
